name: Keepalive base de données

# Empêche la mise en pause du projet Supabase gratuit (inactivité).
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête légère sur l'authentification
        run: |
          STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health")
          echo "Code HTTP : $STATUS"
          if [ "$STATUS" -ge 500 ] || [ "$STATUS" -eq 000 ]; then
            echo "Ping en échec"; exit 1
          fi
